apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-589
  namespace: exam-589
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-589
  template:
    metadata:
      labels:
        app: portal-589
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: portal
          image: docker.io/library/python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir -r requirements.txt && gunicorn --bind 0.0.0.0:5000 --workers 2 app:app
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: portal-data
              mountPath: /data
            - name: portal-app
              mountPath: /app
              readOnly: true
      volumes:
        - name: portal-data
          persistentVolumeClaim:
            claimName: portal-pvc-589
        - name: portal-app
          projected:
            sources:
              - configMap:
                  name: portal-code
              - configMap:
                  name: portal-templates
                  items:
                    - { key: index.html, path: templates/index.html }
                    - { key: edit.html, path: templates/edit.html }
---
apiVersion: v1
kind: Service
metadata:
  name: svc-portal
  namespace: exam-589
spec:
  type: ClusterIP
  selector:
    app: portal-589
  ports:
    - name: http
      port: 80
      targetPort: 5000
