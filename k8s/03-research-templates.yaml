apiVersion: v1
data:
  edit.html: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Research | 68130589</title>
    <style>
    body{margin:0;background:#101827;color:white;
    font-family:Arial,sans-serif;padding:25px}
    form{max-width:900px;margin:30px auto;background:#1e293b;
    padding:30px;border-radius:15px}
    label{display:block;margin-top:20px;color:#7dd3fc}
    input,textarea{width:100%;padding:12px;margin-top:8px;
    border-radius:7px;border:1px solid #475569;background:#0f172a;
    color:white;font-size:16px}
    textarea{min-height:350px;line-height:1.8}
    button{margin-top:25px;padding:13px 25px;background:#0284c7;
    color:white;border:0;border-radius:8px;cursor:pointer}
    a{color:#38bdf8}
    </style>
    </head>
    <body>
    <form method="POST" enctype="multipart/form-data">
    <h2>Edit Research Summary</h2>

    <label>Research Title</label>
    <input name="title" value="{{ data.title }}" required>

    <label>Research Summary</label>
    <textarea name="summary" required>{{ data.summary }}</textarea>

    <label>Research Image</label>
    <input type="file" name="photo" accept="image/*">

    <button type="submit">Save Changes</button>
    <p><a href="/research">Back to Research</a></p>
    </form>
    </body>
    </html>
  research.html: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Research Summary | 68130589</title>
    <style>
    *{box-sizing:border-box}
    body{margin:0;background:#101827;color:#e5e7eb;
    font-family:Arial,sans-serif;line-height:1.8;padding:30px}
    .container{max-width:1000px;margin:30px auto;background:#1e293b;
    padding:35px;border-radius:16px}
    h1{color:#38bdf8;font-size:28px;line-height:1.5}
    h2{color:#7dd3fc}
    .summary{white-space:pre-line;text-align:justify;font-size:17px}
    img{max-width:100%;max-height:400px;border-radius:12px}
    a.button{display:inline-block;margin-top:25px;padding:12px 22px;
    background:#0284c7;color:white;text-decoration:none;border-radius:8px}
    .meta{color:#94a3b8}
    </style>
    </head>
    <body>
    <div class="container">
    <p class="meta">SEMINAR RESEARCH | STUDENT ID: 68130589</p>
    <h1>{{ data.title }}</h1>

    {% if data.image %}
    <img src="/research/uploads/{{ data.image }}" alt="Research Image">
    {% endif %}

    <h2>บทสรุปงานวิจัย</h2>
    <div class="summary">{{ data.summary }}</div>

    <a class="button" href="/research/edit">Edit Research</a>
    </div>
    </body>
    </html>
kind: ConfigMap
