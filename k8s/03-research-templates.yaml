apiVersion: v1
data:
  edit.html: |-
    <!DOCTYPE html>
    <html lang="th"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Research | 68130589</title>
    <style>
    :root{--bg:#07111f;--panel:#12243b;--line:#2b4563;--text:#edf5ff;--muted:#9bb0ca;--blue:#38bdf8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#12365a,transparent 40%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,sans-serif;padding:25px}
    .top{max-width:950px;margin:12px auto}.back{color:var(--blue);text-decoration:none;font-size:13px;font-weight:800}
    .panel{max-width:950px;margin:20px auto;background:linear-gradient(145deg,#172d49,#101e33);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,40px);box-shadow:0 22px 60px #0005}
    .eyebrow{color:var(--blue);font-size:11px;letter-spacing:2px;font-weight:800}h1{font-size:29px;margin:8px 0}.muted{color:var(--muted);line-height:1.7}
    label{display:block;margin:21px 0 8px;font-size:13px;font-weight:700;color:#dceaff}
    input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#09172a;color:white;font:inherit}
    input:focus,textarea:focus{outline:2px solid #38bdf855;border-color:var(--blue)}
    textarea{min-height:360px;line-height:1.8;resize:vertical}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
    .btn{padding:13px 20px;border:0;border-radius:11px;background:linear-gradient(120deg,#38bdf8,#818cf8);color:#071426;font-weight:800;text-decoration:none;cursor:pointer}
    .btn.alt{background:#1b3553;color:#dceaff;border:1px solid var(--line)}
    </style></head><body>
    <div class="top"><a class="back" href="/research">← BACK TO RESEARCH</a></div>
    <main class="panel">
    <div class="eyebrow">CONTENT MANAGEMENT · 68130589</div>
    <h1>Edit Research Summary</h1>
    <p class="muted">ปรับปรุงชื่อเรื่อง บทสรุป และรูปภาพประกอบงานวิจัย</p>
    <form method="POST" enctype="multipart/form-data">
    <label>Research Title</label><input name="title" value="{{ data.title }}" required>
    <label>Research Summary</label><textarea name="summary" required>{{ data.summary }}</textarea>
    <label>Research Image</label><input type="file" name="photo" accept="image/*">
    <div class="actions"><button class="btn" type="submit">SAVE CHANGES</button><a class="btn alt" href="/research">CANCEL</a><a class="btn alt" href="/">HOME</a></div>
    </form>
    </main></body></html>
  research.html: |-
    <!DOCTYPE html>
    <html lang="th"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Research Center | 68130589</title>
    <style>
    :root{--bg:#07111f;--panel:#12243b;--line:#2b4563;--text:#edf5ff;--muted:#a9bad0;--blue:#38bdf8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#12365a,transparent 38%),radial-gradient(ellipse at 90% 90%,#241b52,transparent 35%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,sans-serif}
    .nav{border-bottom:1px solid var(--line);padding:17px 5%;background:#07111fdc}.nav a{color:var(--blue);text-decoration:none;font-weight:800;font-size:13px}
    .wrap{width:min(92%,980px);margin:42px auto}.panel{background:linear-gradient(145deg,#172d49,#101e33);border:1px solid var(--line);border-radius:23px;padding:clamp(22px,4vw,42px);box-shadow:0 22px 60px #0005}
    .eyebrow{color:var(--blue);font-size:11px;letter-spacing:2px;font-weight:800}.tag{display:inline-block;margin:15px 0 0;padding:6px 11px;border:1px solid #315577;border-radius:20px;color:#a8dfff;font-size:11px}
    h1{font-size:clamp(24px,4vw,36px);line-height:1.5;margin:17px 0;color:#f4f8ff}
    h2{font-size:19px;margin:28px 0 12px}.summary{white-space:pre-line;text-align:justify;line-height:2;color:#d0deee;font-size:15px}
    img{display:block;max-width:100%;max-height:440px;object-fit:contain;border-radius:15px;border:1px solid var(--line);margin:22px auto}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:23px;border-top:1px solid var(--line)}
    .btn{display:inline-flex;padding:12px 19px;border-radius:11px;background:linear-gradient(120deg,#38bdf8,#818cf8);color:#071426;text-decoration:none;font-size:13px;font-weight:800}
    .btn.alt{background:#1b3553;color:#dceaff;border:1px solid var(--line)}
    </style></head><body>
    <nav class="nav"><a href="/">← PANYAPAT. / HOME</a></nav>
    <main class="wrap"><article class="panel">
    <div class="eyebrow">RESEARCH & DEVELOPMENT · STUDENT ID: 68130589</div>
    <span class="tag">SEMINAR RESEARCH</span>
    <h1>{{ data.title }}</h1>
    {% if data.image %}<img src="/research/uploads/{{ data.image }}" alt="Research Image">{% endif %}
    <h2>บทสรุปงานวิจัย</h2>
    <div class="summary">{{ data.summary }}</div>
    <div class="actions"><a class="btn" href="/research/edit">✎ &nbsp; EDIT RESEARCH</a><a class="btn alt" href="/">← BACK TO HOME</a></div>
    </article></main></body></html>
kind: ConfigMap
