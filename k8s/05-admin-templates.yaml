data:
  index.html: "<!DOCTYPE html>\n<html lang=\"th\"><head>\n<meta charset=\"UTF-8\"><meta
    name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Admin
    Console | 68130589</title>\n<style>\n:root{--bg:#07111f;--panel:#12243b;--line:#2b4563;--text:#edf5ff;--muted:#9bb0ca;--blue:#38bdf8}\n*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse
    at 15% 0%,#12365a,transparent 38%),radial-gradient(ellipse at 90% 90%,#241b52,transparent
    35%),var(--bg);color:var(--text);font-family:Inter,\"Segoe UI\",Tahoma,sans-serif}\n.nav{padding:18px
    5%;border-bottom:1px solid var(--line);background:#07111fdc}.nav a{color:var(--blue);text-decoration:none;font-weight:800;font-size:13px}\n.wrap{width:min(92%,900px);margin:55px
    auto}.panel{padding:clamp(25px,5vw,48px);background:linear-gradient(145deg,#172d49,#101e33);border:1px
    solid var(--line);border-radius:24px;box-shadow:0 22px 65px #0005}\n.eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:800}h1{font-size:clamp(27px,4vw,38px);margin:12px
    0}.muted{color:var(--muted);line-height:1.8}\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin-top:30px}\n.item{display:block;padding:25px;border-radius:17px;background:#0d1d32;border:1px
    solid var(--line);text-decoration:none;color:var(--text);transition:.2s}\n.item:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0
    14px 35px #0004}\n.icon{font-size:27px;margin-bottom:17px}.item h2{font-size:18px;margin:0
    0 8px}.item p{font-size:13px;color:var(--muted);line-height:1.7}.open{font-size:12px;color:var(--blue);font-weight:800}\n.footer{margin-top:28px;padding-top:20px;border-top:1px
    solid var(--line);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}\n@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{margin:28px
    auto}}\n</style></head><body>\n<nav class=\"nav\"><a href=\"http://www.iam-589.com/\">←
    VISIT MAIN PORTAL</a></nav>\n<main class=\"wrap\"><section class=\"panel\">\n<div
    class=\"eyebrow\">SYSTEM MANAGEMENT · ADMINISTRATOR</div>\n<h1>Admin Console</h1>\n<p
    class=\"muted\">ศูนย์จัดการข้อมูลเว็บไซต์สำหรับ Student Portal และ Seminar Research</p>\n<div
    class=\"grid\">\n<a class=\"item\" href=\"http://www.iam-589.com/edit\"><div class=\"icon\">\U0001F464</div><h2>Manage
    Profile</h2><p>แก้ไขชื่อ รหัสนักศึกษา และรูปภาพโปรไฟล์</p><span class=\"open\">EDIT
    PROFILE →</span></a>\n<a class=\"item\" href=\"http://www.iam-589.com/research/edit\"><div
    class=\"icon\">\U0001F4DA</div><h2>Manage Research</h2><p>แก้ไขหัวข้องานวิจัย
    บทสรุป และรูปภาพประกอบ</p><span class=\"open\">EDIT RESEARCH →</span></a>\n</div>\n<div
    class=\"footer\"><span class=\"muted\">STUDENT ID: 68130589</span><a class=\"open\"
    href=\"http://www.iam-589.com/\">BACK TO MAIN PORTAL ↗</a></div>\n</section></main></body></html>"
