    <!DOCTYPE html>
    <html lang="th">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Portal | 68130589</title>
    <style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101827;
        color: white;
        font-family: Arial, sans-serif;
    }
    .container {
        width: 90%;
        max-width: 750px;
        padding: 40px;
        background: #1e293b;
        border-radius: 18px;
        text-align: center;
    }
    h1 { color: #38bdf8; }
    .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 35px;
    }
    a {
        display: block;
        padding: 25px 15px;
        border-radius: 12px;
        background: #0284c7;
        color: white;
        text-decoration: none;
        font-weight: bold;
    }
    a:hover { background: #0369a1; }
    p { color: #94a3b8; }
    @media(max-width:600px) {
        .menu { grid-template-columns: 1fr; }
    }
    </style>
    </head>
    <body>
    <div class="container">
        <h1>ADMIN DASHBOARD</h1>
        <p>STUDENT ID: 68130589</p>
        <p>ระบบจัดการข้อมูลเว็บไซต์</p>

        <div class="menu">
            <a href="http://www.iam-589.com/edit">
                EDIT PORTAL
            </a>

            <a href="http://www.iam-589.com/research/edit">
                EDIT RESEARCH
            </a>
        </div>
    </div>
    </body>
