apiVersion: v1
data:
  app.py: |
    from flask import Flask, render_template

    app = Flask(__name__)

    @app.route("/")
    def index():
        return render_template("index.html")

    @app.route("/health")
    def health():
        return {"status": "ok", "application": "admin-589"}

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=5000)
  requirements.txt: |
    Flask==3.1.2
    gunicorn==23.0.0
kind: ConfigMap
metadata:
  name: admin-code
  namespace: exam-589
