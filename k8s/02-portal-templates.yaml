apiVersion: v1
data:
  edit.html: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Portal</title>
    <style>
    body{background:#101827;color:white;font-family:Arial;padding:30px}
    form{max-width:500px;margin:50px auto;background:#1e293b;
    padding:30px;border-radius:15px}
    label{display:block;margin-top:18px}
    input{width:100%;padding:12px;margin-top:8px;border-radius:7px;border:0}
    button{margin-top:25px;padding:12px 25px;background:#0284c7;
    color:white;border:0;border-radius:8px;cursor:pointer}
    a{color:#38bdf8}
    </style>
    </head>
    <body>
    <form method="POST" enctype="multipart/form-data">
    <h2>Edit Student Portal</h2>
    <label>Student Name</label>
    <input name="name" value="{{ data.name }}" required>
    <label>Student ID</label>
    <input name="student_id" value="{{ data.student_id }}" required>
    <label>Profile Image</label>
    <input type="file" name="photo" accept="image/*">
    <button type="submit">Save Changes</button>
    <p><a href="/">Back to Portal</a></p>
    </form>
    </body>
    </html>
  index.html: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Portal | 68130589</title>
    <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#101827;color:#fff;
    font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
    .card{width:90%;max-width:600px;background:#1e293b;padding:40px;
    border-radius:20px;text-align:center;box-shadow:0 15px 45px #0006}
    .avatar{width:170px;height:170px;border-radius:50%;object-fit:cover;
    border:4px solid #38bdf8;background:#334155}
    h1{margin:24px 0 10px;font-size:30px}
    .id{color:#38bdf8;font-size:20px;letter-spacing:2px}
    a{display:inline-block;margin-top:28px;padding:12px 25px;
    background:#0284c7;color:white;text-decoration:none;border-radius:9px}
    </style>
    </head>
    <body>
    <div class="card">
    {% if data.image %}
    <img class="avatar" src="/uploads/{{ data.image }}" alt="Student Profile">
    {% else %}
    <div class="avatar" style="margin:auto;display:flex;align-items:center;
    justify-content:center;font-size:60px">PS</div>
    {% endif %}
    <h1>{{ data.name }}</h1>
    <div class="id">STUDENT ID: {{ data.student_id }}</div>
    <a href="/edit">Edit Profile</a>
    </div>
    </body>
    </html>
kind: ConfigMap
metadata:
  name: portal-templates
  namespace: exam-589
